[settings]
task.run_auto_install = false

[dotfiles."~"]
source = "home"
mode = "symlink-each"
relative = true

exclude = [".DS_Store", "node_modules", ".git"]

[tasks.format]
description = "Format all managed packages and repository tooling"
depends = [
  "neovim:format",
  "pi:format",
  "agents:format",
  "claude:format",
  "mise:format",
  "scripts:format",
  "repo:format",
]

[tasks."format:check"]
description = "Check formatting for all managed packages and repository tooling without writing files"
depends = [
  "neovim:format:check",
  "pi:format:check",
  "agents:format:check",
  "claude:format:check",
  "mise:format:check",
  "scripts:format:check",
  "repo:format:check",
]

[tasks.lint]
description = "Lint Pi extensions, repository scripts, and Claude shell scripts"
depends = ["pi:lint", "scripts:lint", "claude:lint"]

[tasks.typecheck]
description = "Typecheck Pi extensions and repository scripts"
depends = ["pi:typecheck", "scripts:typecheck"]

[tasks.check]
description = "Run all available package checks"
depends = ["neovim:check", "pi:check", "agents:check", "claude:check", "mise:check", "scripts:check", "repo:check"]

[tasks."neovim:check"]
description = "Check Neovim formatting"
depends = ["neovim:format:check"]

[tasks."pi:check"]
description = "Check Pi formatting, lint, and types"
depends = ["pi:format:check", "pi:lint", "pi:typecheck"]

[tasks."agents:check"]
description = "Check shared agent skill formatting"
depends = ["agents:format:check"]

[tasks."claude:check"]
description = "Check Claude formatting, shell lint, and shell syntax"
depends = ["claude:format:check", "claude:lint", "claude:syntax"]

[tasks."mise:check"]
description = "Check mise configuration formatting"
depends = ["mise:format:check"]

[tasks."scripts:check"]
description = "Check repository script formatting, lint, types, and tests"
depends = ["scripts:format:check", "scripts:lint", "scripts:typecheck", "scripts:test"]

[tasks."repo:check"]
description = "Check shared root formatting and Git whitespace"
dir = "{{config_root}}"
depends = ["repo:format:check"]
run = "git diff --check"

[tasks."neovim:format"]
description = "Format Neovim Lua and Oxfmt-supported files, excluding the generated package lockfile"
dir = "{{config_root}}"
run = [
  "stylua --verify --allow-hidden --config-path .stylua.toml home/.config/nvim",
  "oxfmt --write .stylua.toml home/.config/nvim '!home/.config/nvim/nvim-pack-lock.json'",
]

[tasks."neovim:format:check"]
description = "Check Neovim formatting without writing files; exclude the generated package lockfile"
dir = "{{config_root}}"
run = [
  "stylua --check --verify --allow-hidden --config-path .stylua.toml home/.config/nvim",
  "oxfmt --check .stylua.toml home/.config/nvim '!home/.config/nvim/nvim-pack-lock.json'",
]

[tasks."pi:format"]
description = "Format Pi configuration, extensions, and documentation"
dir = "{{config_root}}"
run = "oxfmt --write home/.pi tsconfig.json"

[tasks."pi:format:check"]
description = "Check Pi formatting without writing files"
dir = "{{config_root}}"
run = "oxfmt --check home/.pi tsconfig.json"

[tasks."pi:lint"]
description = "Lint all JavaScript and TypeScript files belonging to Pi"
dir = "{{config_root}}"
run = "oxlint home/.pi"

[tasks."pi:typecheck"]
description = "Typecheck Pi TypeScript files without emitting files"
dir = "{{config_root}}"
depends = ["repo:deps"]
run = "tsc --project tsconfig.json"

[tasks."agents:format"]
description = "Format shared agent skills and their Oxfmt-supported files"
dir = "{{config_root}}"
run = "oxfmt --write home/.agents"

[tasks."agents:format:check"]
description = "Check shared agent skill formatting without writing files"
dir = "{{config_root}}"
run = "oxfmt --check home/.agents"

[tasks."claude:format"]
description = "Format Claude configuration and shell scripts; shared skills belong to agents"
dir = "{{config_root}}"
run = ["oxfmt --write home/.claude '!home/.claude/skills/**'", "shfmt -ln bash -i 2 -w home/.claude"]

[tasks."claude:format:check"]
description = "Check Claude configuration and shell script formatting without writing files"
dir = "{{config_root}}"
run = ["oxfmt --check home/.claude '!home/.claude/skills/**'", "shfmt -ln bash -i 2 -d home/.claude"]

[tasks."claude:lint"]
description = "Lint Claude Bash scripts with ShellCheck; reject all findings"
dir = "{{config_root}}"
run = "find home/.claude -type f -name '*.sh' -exec shellcheck --shell=bash {} +"

[tasks."claude:syntax"]
description = "Validate Claude Bash script syntax with macOS system Bash without executing scripts"
dir = "{{config_root}}"
run = """
find home/.claude -type f -name '*.sh' -exec /bin/bash -c '
  for script do /bin/bash -n "$script" || exit; done
' bash {} +
"""

[tasks."mise:format"]
description = "Format repository and home mise configuration"
dir = "{{config_root}}"
run = "oxfmt --write mise.toml home/.config/mise"

[tasks."mise:format:check"]
description = "Check mise configuration formatting without writing files"
dir = "{{config_root}}"
run = "oxfmt --check mise.toml home/.config/mise"

[tasks."scripts:format"]
description = "Format repository scripts, tests, documentation, and TypeScript configuration"
dir = "{{config_root}}"
run = "oxfmt --write scripts tsconfig.scripts.json"

[tasks."scripts:format:check"]
description = "Check repository script formatting without writing files"
dir = "{{config_root}}"
run = "oxfmt --check scripts tsconfig.scripts.json"

[tasks."scripts:lint"]
description = "Lint JavaScript scripts and tests with Oxlint"
dir = "{{config_root}}"
run = "oxlint scripts"

[tasks."scripts:typecheck"]
description = "Typecheck repository JavaScript and TypeScript files without emitting files"
dir = "{{config_root}}"
depends = ["repo:deps"]
run = "tsc --project tsconfig.scripts.json"

[tasks."scripts:test"]
description = "Run all JavaScript script tests with Node's test runner"
dir = "{{config_root}}"
depends = ["repo:deps"]
run = "node --test 'scripts/**/*.test.mjs'"

# Only root-level metadata belongs to repo; package-specific configuration is handled above.
# Use find rather than Oxfmt globs to avoid matching files inside package directories.
[tasks."repo:format"]
description = "Format shared root configuration and documentation, excluding the generated npm lockfile"
dir = "{{config_root}}"
run = """
find . -maxdepth 1 -type f \\( -name '*.json' -o -name '*.toml' -o -name '*.md' \\) \\
  ! -name package-lock.json ! -name mise.toml ! -name .stylua.toml \\
  ! -name tsconfig.json ! -name tsconfig.scripts.json -exec oxfmt --write {} +
"""

[tasks."repo:format:check"]
description = "Check shared root configuration and documentation formatting without writing files"
dir = "{{config_root}}"
run = """
find . -maxdepth 1 -type f \\( -name '*.json' -o -name '*.toml' -o -name '*.md' \\) \\
  ! -name package-lock.json ! -name mise.toml ! -name .stylua.toml \\
  ! -name tsconfig.json ! -name tsconfig.scripts.json -exec oxfmt --check {} +
"""

[tasks."repo:deps"]
description = "Install locked repository development dependencies"
dir = "{{config_root}}"
run = "npm ci --include=dev"

[tasks."pi:deps:upgrade:preview"]
description = "Preview dependency alignment with installed Pi, its TypeBox, and active Node"
dir = "{{config_root}}"
run = "node scripts/pi-deps.mjs --dry-run"

[tasks."pi:deps:upgrade"]
description = "Align development dependencies with installed Pi, its TypeBox, and active Node"
dir = "{{config_root}}"
depends = ["pi:deps:upgrade:preview"]
run = "node scripts/pi-deps.mjs"

[tasks."bootstrap:preview"]
description = "Preview bootstrap for all repository-managed configuration"
dir = "{{config_root}}"
run = "mise bootstrap --dry-run"

[tasks."bootstrap:dotfiles"]
description = "Preview and bootstrap repository-managed dotfiles"
dir = "{{config_root}}"
run = ["mise bootstrap --only dotfiles --dry-run", "mise bootstrap --only dotfiles --yes"]

[tasks."bootstrap:tools"]
description = "Preview and bootstrap globally declared tools, then install development dependencies"
dir = "{{config_root}}"
run = ["mise bootstrap --only tools --dry-run", "mise bootstrap --only tools --yes", { task = "repo:deps" }]

[tasks."bootstrap:brew"]
description = "Preview and bootstrap globally declared Homebrew packages"
dir = "{{config_root}}"
run = ["mise bootstrap packages apply --manager brew --dry-run", "mise bootstrap packages apply --manager brew --yes"]

[tasks."bootstrap:macos"]
description = "Preview and bootstrap macOS defaults and LaunchAgents"
dir = "{{config_root}}"
run = [
  "mise bootstrap --only macos-defaults,macos-launchd-agents --dry-run",
  "mise bootstrap --only macos-defaults,macos-launchd-agents --yes",
]

[tasks."bootstrap:without-dotfiles"]
description = "Bootstrap Brew packages, macOS configuration, and tools, then verify"
dir = "{{config_root}}"
run = [
  { task = "bootstrap:brew" },
  { task = "bootstrap:macos" },
  { task = "bootstrap:tools" },
  { task = "bootstrap:check" },
]

[tasks."bootstrap:apply"]
description = "Bootstrap dotfiles first, then all remaining scopes, and verify"
dir = "{{config_root}}"
# Sequential task calls ensure global configuration is linked before it is loaded.
run = [{ task = "bootstrap:dotfiles" }, { task = "bootstrap:without-dotfiles" }]

[tasks."bootstrap:check"]
description = "Check Git whitespace and verify repository bootstrap state"
dir = "{{config_root}}"
run = ["git diff --check", "git status --short --untracked-files=all", "mise bootstrap status --missing"]

[tasks."brew:upgrade:preview"]
description = "Preview upgrades for globally declared Homebrew formulae"
dir = "{{config_root}}"
run = "mise bootstrap packages upgrade --manager brew --dry-run"

[tasks."brew:upgrade"]
description = "Preview and upgrade globally declared Brew packages only"
dir = "{{config_root}}"
depends = ["brew:upgrade:preview"]
run = "mise bootstrap packages upgrade --manager brew --yes"

[tasks."tools:upgrade:preview"]
description = "Preview upgrades for configured mise tools within their version constraints"
dir = "{{config_root}}"
run = "mise upgrade --dry-run"

[tasks."tools:upgrade"]
description = "Preview and upgrade configured mise tools within their version constraints"
dir = "{{config_root}}"
depends = ["tools:upgrade:preview"]
run = "mise upgrade --yes"
