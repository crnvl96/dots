[dotfiles."~"]
source = "home"
mode = "symlink-each"
manifest = "git"
relative = true

# These trees are linked as directories by the entries below.
exclude = [".config/ghostty", ".config/mise", ".config/nvim", ".config/rex"]

[dotfiles."~/.config/ghostty"]
source = "home/.config/ghostty"
mode = "symlink"
relative = true

[dotfiles."~/.config/mise"]
source = "home/.config/mise"
mode = "symlink"
relative = true

[dotfiles."~/.config/nvim"]
source = "home/.config/nvim"
mode = "symlink"
relative = true

[dotfiles."~/.config/rex"]
source = "home/.config/rex"
mode = "symlink"
relative = true

[tasks.boot]
description = "Set up runtime tools and dotfiles from the repo's mise config"
dir = "{{ config_root }}"
env = { MISE_GLOBAL_CONFIG_FILE = "{{ config_root }}/home/.config/mise/config.toml" }
raw = true
run = "mise bootstrap"

[tasks."boot:preview"]
description = "Preview runtime tool and dotfile setup without applying it"
dir = "{{ config_root }}"
env = { MISE_GLOBAL_CONFIG_FILE = "{{ config_root }}/home/.config/mise/config.toml" }
run = "mise bootstrap --dry-run"

[tasks."boot:status"]
description = "Show the state of configured runtime tools and dotfiles"
dir = "{{ config_root }}"
env = { MISE_GLOBAL_CONFIG_FILE = "{{ config_root }}/home/.config/mise/config.toml" }
run = "mise bootstrap status"

[tasks."repo:check"]
description = "Format the Neovim configuration"
dir = "{{ config_root }}"
run = [
  "(cd home/.config/nvim && stylua .)",
]
