# Shared directories: link tracked files and preserve machine-local files.
[dotfiles."~/.agents"]
source = "home/.agents"
mode = "symlink-each"
manifest = "git"
relative = true

[dotfiles."~/.claude"]
source = "home/.claude"
mode = "symlink-each"
manifest = "git"
relative = true

[dotfiles."~/.config/zed"]
source = "home/.config/zed"
mode = "symlink-each"
manifest = "git"
relative = true

# Repo-owned directories: link each configuration tree as a whole.
[dotfiles."~/.config/ghostty"]
source = "home/.config/ghostty"
mode = "symlink"
relative = true

[dotfiles."~/.config/mise"]
source = "home/.config/mise"
mode = "symlink"
relative = true

[dotfiles."~/.config/nvim"]
source = "home/.config/nvim"
mode = "symlink"
relative = true

[dotfiles."~/.config/rex"]
source = "home/.config/rex"
mode = "symlink"
relative = true

# Standalone files.
[dotfiles."~/.zshrc"]
source = "home/.zshrc"
mode = "symlink"
relative = true

[tasks.boot]
description = "Set up runtime tools and dotfiles"
env = { MISE_GLOBAL_CONFIG_FILE = "{{ config_root }}/home/.config/mise/config.toml" }
raw = true
run = "mise bootstrap"

[tasks."repo:fmt"]
description = "Format the Neovim configuration"
dir = "{{ config_root }}/home/.config/nvim"
run = "stylua ."
