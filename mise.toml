[settings]
task.run_auto_install = false

[dotfiles."~"]
source = "home"
mode = "symlink-each"
relative = true

exclude = [".DS_Store", "node_modules", ".git"]

[tasks."bootstrap:preview"]
description = "Preview bootstrap across the main, Neovim, and Pi config scopes"
dir = "{{config_root}}"
# Preview source configs so this also works before their target links exist.
run = [
  "mise bootstrap --dry-run",
  "mise -C home/.config/nvim bootstrap --dry-run",
  "mise -C home/.pi bootstrap --dry-run",
]

[tasks."bootstrap:apply"]
description = "Preview and apply macOS settings, Brew packages, dotfiles, tools, and hooks across all scopes, then verify"
dir = "{{config_root}}"
depends = ["bootstrap:preview"]
# Apply the main scope first to deploy the Neovim and Pi config links.
run = [
  "mise bootstrap --yes",
  'mise -C "$HOME/.config/nvim" bootstrap --yes',
  'mise -C "$HOME/.pi" bootstrap --yes',
  { task = "bootstrap:check" },
]

[tasks."bootstrap:check"]
description = "Check Git whitespace and verify bootstrap state across all config scopes"
dir = "{{config_root}}"
run = [
  "git diff --check",
  "git status --short --untracked-files=all",
  "mise bootstrap status --missing",
  'mise -C "$HOME/.config/nvim" bootstrap status --missing',
  'mise -C "$HOME/.pi" bootstrap status --missing',
]

[tasks."brew:upgrade:preview"]
description = "Preview upgrades for globally declared Homebrew formulae"
dir = "{{config_root}}"
run = "mise bootstrap packages upgrade --manager brew --dry-run"

[tasks."brew:upgrade"]
description = "Preview and upgrade globally declared Brew packages only"
dir = "{{config_root}}"
depends = ["brew:upgrade:preview"]
run = "mise bootstrap packages upgrade --manager brew --yes"
