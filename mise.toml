[settings]
task.run_auto_install = false

[dotfiles."~"]
source = "home"
mode = "symlink-each"
relative = true

exclude = [".DS_Store", "node_modules", ".git"]

[tasks."bootstrap:preview"]
description = "Dry-run the full bootstrap workflow, including tools and hooks"
dir = "{{config_root}}"
run = "mise bootstrap --dry-run"

[tasks."bootstrap:apply"]
description = "Preview, confirm, bootstrap, then verify configured state"
dir = "{{config_root}}"
depends = ["bootstrap:preview"]
confirm = { message = "Apply the previewed bootstrap changes (dotfiles, macOS preferences, tools, and configured hooks)? Stop if there are conflicts or unexpected changes.", default = "no" }
raw = true
run = ["mise bootstrap --yes", { task = "bootstrap:check" }]

[tasks."bootstrap:check"]
description = "Check Git whitespace and fail if configured bootstrap state differs"
dir = "{{config_root}}"
run = [
  "git diff --check",
  "git status --short --untracked-files=all",
  "mise bootstrap status --missing",
]

[tasks."brew:upgrade:preview"]
description = "Preview upgrades for mise-managed Homebrew formulae"
dir = "{{config_root}}"
run = "mise bootstrap packages upgrade --manager brew --dry-run"

[tasks."brew:upgrade"]
description = "Preview, confirm, then upgrade mise-managed Homebrew formulae"
dir = "{{config_root}}"
depends = ["brew:upgrade:preview"]
confirm = { message = "Upgrade the previewed mise-managed Homebrew formulae?", default = "no" }
raw = true
run = "mise bootstrap packages upgrade --manager brew --yes"
