[dotfiles."~"]
source = "home"
mode = "symlink-each"
relative = true

exclude = [".DS_Store", "node_modules", ".git"]

[tasks.format]
description = "Format the Neovim and Pi configs"
dir = "{{ config_root }}"
run = [
  "(cd home/.config/nvim && stylua .)",
  "(cd home/.pi && ./node_modules/.bin/oxfmt .)",
]
