[settings]
task.run_auto_install = false

# Tools for the Neovim and Pi configurations.
[tools]
stylua = "latest"
lua-language-server = "latest"

[dotfiles."~"]
source = "home"
mode = "symlink-each"
relative = true

exclude = [".DS_Store", "node_modules", ".git"]

[tasks.format]
description = "Format the Neovim and Pi configurations"
depends = ["nvim:format", "pi:format"]

[tasks.lint]
description = "Lint Pi extensions"
depends = ["pi:lint"]

[tasks.typecheck]
description = "Typecheck Pi extensions"
depends = ["pi:typecheck"]

[tasks."nvim:format"]
description = "Format the Neovim Lua configuration with StyLua"
dir = "{{config_root}}/home/.config/nvim"
run = "stylua --verify ."

[tasks."pi:format"]
description = "Format Pi extensions and managed JSON configuration"
dir = "{{config_root}}/home/.pi"
run = "oxfmt --write agent/extensions/*.ts agent/keybindings.json agent/mcp.json agent/settings.json"

[tasks."pi:lint"]
description = "Lint Pi extensions"
dir = "{{config_root}}/home/.pi"
run = "oxlint --deny-warnings agent/extensions/*.ts"

[tasks."pi:typecheck"]
description = "Typecheck Pi extensions without emitting files"
dir = "{{config_root}}/home/.pi"
run = "tsc --noEmit --strict --skipLibCheck --target esnext --module preserve --moduleResolution bundler agent/extensions/*.ts"

[tasks."bootstrap:preview"]
description = "Preview bootstrap for all repository-managed configuration"
dir = "{{config_root}}"
run = "mise bootstrap --dry-run"

[tasks."bootstrap:apply"]
description = "Preview and apply macOS settings, Brew packages, dotfiles, tools, and hooks, then verify"
dir = "{{config_root}}"
depends = ["bootstrap:preview"]
run = [
  "mise bootstrap --yes",
  { task = "bootstrap:check" },
]

[tasks."bootstrap:check"]
description = "Check Git whitespace and verify repository bootstrap state"
dir = "{{config_root}}"
run = [
  "git diff --check",
  "git status --short --untracked-files=all",
  "mise bootstrap status --missing",
]

[tasks."brew:upgrade:preview"]
description = "Preview upgrades for globally declared Homebrew formulae"
dir = "{{config_root}}"
run = "mise bootstrap packages upgrade --manager brew --dry-run"

[tasks."brew:upgrade"]
description = "Preview and upgrade globally declared Brew packages only"
dir = "{{config_root}}"
depends = ["brew:upgrade:preview"]
run = "mise bootstrap packages upgrade --manager brew --yes"
