model = "gpt-6-astra"
model_reasoning_effort = "high"
[tui]
screen_reader_detection_done = true
theme = "base16-256"
show_tooltips = true
status_line_use_colors = true
status_line = ["approval-mode", "model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "context-used", "five-hour-limit", "context-window-size", "weekly-limit"]
terminal_title = ["activity", "thread-name"]
auto_recap = false

[tui.model_availability_nux]
"gpt-6.1-sol" = 1

[projects."/Users/velozient/Documents/dotfiles"]
trust_level = "trusted"

[mcp_servers.inkdrop]
env_vars = ["INKDROP_LOCAL_PASSWORD"]
command = "npx"
args = ["-y", "@inkdropapp/mcp-server@latest"]

[mcp_servers.inkdrop.env]
INKDROP_LOCAL_SERVER_URL = "http://localhost:19840"
INKDROP_LOCAL_USERNAME = "inkdrop"
