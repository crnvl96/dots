[settings]
color_theme = "auto"

[env]
EDITOR = "nvim"
VISUAL = "nvim"

[shell_alias]
ex = "exit"
cl = "clear"
nv = "nvim"
ls = "eza -l"
la = "eza -la"
cat = "bat"
lzg= "lazygit"

[tools]
go = "1.27.2"
node = "24"
python = "3.14"
bun = "1.4"
rust = { version = "1.99", components = ["rust-analyzer", "rust-src"] }
"npm:skills" = "latest"
"npm:agent-browser" = { version = "latest", postinstall = "agent-browser install" }
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:typescript" = "latest"
